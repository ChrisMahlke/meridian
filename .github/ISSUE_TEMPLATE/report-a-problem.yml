name: Report a problem
description: Something in Meridian isn't working, or shows the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Issues are public, so leave out anything you'd rather not share, such as your exact location.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what Meridian showed, and what you expected to see. Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: iPhone 16 Pro, iOS 26.1
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Meridian version
      description: At the bottom of ⋯ › Settings.
      placeholder: 1.0 (2)
  - type: input
    id: place-and-time
    attributes:
      label: Nearest town, and the date and time Meridian showed
      description: Only if the problem is about where something is in the sky, or when it rises or sets.
      placeholder: Portland, Oregon, October 15 at 6:20 PM
